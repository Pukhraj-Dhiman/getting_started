name: SmartKharid

on:
  push:
    paths: ["smartkharid/**", ".github/workflows/smartkharid.yml"]
  pull_request:
    paths: ["smartkharid/**", ".github/workflows/smartkharid.yml"]
  # Actions tab -> SmartKharid -> "Run workflow" (available once this file is on the default branch)
  # also builds the Windows, macOS and web versions.
  workflow_dispatch:

concurrency:
  group: smartkharid-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: smartkharid

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  # Every push builds the Android APK and publishes it as the "smartkharid-apk" pre-release,
  # so it can be downloaded straight onto a phone.
  android:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write # to publish the pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Sign every build with the same key, so a newer test APK installs over the old one.
      # Uses the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD repository secrets when set
      # (key alias "upload"); otherwise a test key created on the first run and kept in the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.smartkharid-signing
          key: smartkharid-signing-v1
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$HOME/.smartkharid-signing/upload.jks"
          PASS="${KEYSTORE_PASSWORD:-smartkharid-test}"
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/upload.jks"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          elif [ ! -f "$KS" ]; then
            mkdir -p "$(dirname "$KS")"
            keytool -genkeypair -keystore "$KS" -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=SmartKharid Test, O=SmartKharid, C=IN"
          fi
          echo "::add-mask::$PASS"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$KS"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=upload"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass "$PASS" | grep -m1 "SHA256:"
      - run: uv sync
      # --yes lets Flet install the Flutter SDK, JDK 17 and Android SDK packages it needs.
      - run: uv run flet build apk --yes --no-rich-output -v --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: smartkharid-apk
          path: smartkharid/build/apk/smartkharid.apk
          if-no-files-found: error
          retention-days: 30
      - name: Check APK signature
        continue-on-error: true
        run: |
          ls -lh build/apk
          SDK="${ANDROID_HOME:-$HOME/Android/sdk}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/apk/smartkharid.apk
      - name: Publish test APK as a pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: smartkharid-apk
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" build/apk/smartkharid.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "SmartKharid test APK (build ${{ github.run_number }})" \
            --notes "Test build from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your Android phone: download smartkharid.apk, allow 'Install unknown apps' for your browser, then install."

  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: web, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run flet build ${{ matrix.target }} --yes --no-rich-output
      - uses: actions/upload-artifact@v4
        with:
          name: smartkharid-${{ matrix.target }}
          path: smartkharid/build/${{ matrix.target }}
